<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>清邁旅遊泰語</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Sans+Thai+Looped:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4FA; --surface:#FFFFFF; --sunk:#E8EAF4; --ink:#1A1F3D; --muted:#5A6083; --line:#D5D8E8;
  --indigo:#2C3A8F; --indigo-ink:#FFFFFF; --red:#C3352B; --gold:#9A6B00; --good:#1E8A5A; --bad:#C3352B;
  --t-mid:#6B7090; --t-low:#2563C9; --t-fall:#8B3FB0; --t-high:#D06A00; --t-rise:#14905F;
  --thai:"Noto Sans Thai Looped","Noto Sans Thai","Thonburi","Leelawadee UI","Tahoma",sans-serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#13162B; --surface:#1C2040; --sunk:#262B52; --ink:#ECEEFA; --muted:#A3A8C9; --line:#343A68;
    --indigo:#8E9BFF; --indigo-ink:#13162B; --red:#FF7B6F; --gold:#E7B64A; --good:#4CD39A; --bad:#FF7B6F;
    --t-mid:#B5B9D6; --t-low:#7FB0FF; --t-fall:#D59BFF; --t-high:#FFB061; --t-rise:#5FE0A8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13162B; --surface:#1C2040; --sunk:#262B52; --ink:#ECEEFA; --muted:#A3A8C9; --line:#343A68;
  --indigo:#8E9BFF; --indigo-ink:#13162B; --red:#FF7B6F; --gold:#E7B64A; --good:#4CD39A; --bad:#FF7B6F;
  --t-mid:#B5B9D6; --t-low:#7FB0FF; --t-fall:#D59BFF; --t-high:#FFB061; --t-rise:#5FE0A8;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--indigo);outline-offset:2px;border-radius:6px}
.wrap{max-width:720px;margin:0 auto;padding:20px 18px 32px}
h1,h2,h3{margin:0;line-height:1.3}
h2{font-size:1.35rem;font-weight:900;letter-spacing:.01em}
h3{font-size:1.05rem;font-weight:700}
p{margin:.4em 0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.th{font-family:var(--thai)}
section{margin-top:34px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 8px;text-decoration:none;color:var(--muted);font-size:.78rem;font-weight:500}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--red);font-weight:700}
@media (min-width:860px){
  body{padding-bottom:0}
  nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);bottom:auto;border-top:0;border-bottom:1px solid var(--line)}
  nav.tabs a{flex-direction:row;justify-content:center;gap:8px;font-size:.95rem;padding:14px 4px}
  body::before{background:var(--surface)}
}

/* hero */
.hero{padding-top:18px}
.hero .greet{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hero .big{font-family:var(--thai);font-weight:800;font-size:clamp(4rem,17vw,6.6rem);line-height:1.05;color:var(--indigo);letter-spacing:-.01em}
.hero .rom{font-size:1.5rem;margin-top:4px}
.hero .lead{font-size:1.15rem;margin-top:10px}
.trip{margin-top:18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.95rem}
.trip strong{font-size:1.6rem;color:var(--red);font-weight:900;line-height:1}
.trip input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}

/* tone */
.t-mid{color:var(--t-mid)} .t-low{color:var(--t-low)} .t-fall{color:var(--t-fall)} .t-high{color:var(--t-high)} .t-rise{color:var(--t-rise)}
.rom{font-family:var(--sans);font-weight:500;letter-spacing:.01em}
.rom .sep{color:var(--muted);opacity:.6}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;margin-top:8px}
.legend span b{font-weight:700}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;padding:10px 18px;font-weight:700;background:var(--red);color:#fff;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.indigo{background:var(--indigo);color:var(--indigo-ink)}
.btn.sm{padding:6px 12px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:default}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;color:var(--ink);font-size:.8rem;font-weight:700;flex:none}
.iconbtn svg{width:18px;height:18px}
.iconbtn.play{background:var(--red);border-color:var(--red);color:#fff}
.iconbtn.on{background:var(--good);border-color:var(--good);color:#fff}
.playbig{width:64px;height:64px;border-radius:50%;border:0;background:var(--red);color:#fff;display:grid;place-items:center;margin-bottom:14px}
.playbig svg{width:28px;height:28px}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:600;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}

/* plan */
.days{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:thin}
.days button{flex:none;width:42px;height:48px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;font-size:.95rem}
.days button small{font-size:.62rem;font-weight:500;color:var(--muted)}
.days button.today{border-color:var(--red)}
.days button[aria-pressed="true"]{background:var(--indigo);color:var(--indigo-ink);border-color:var(--indigo)}
.days button[aria-pressed="true"] small{color:inherit}
.days button.done{background:var(--sunk)}
.plan{background:var(--surface);border-radius:16px;padding:18px 18px 8px;border-left:6px solid var(--red)}
.plan h3{font-size:1.2rem}
.task{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.task input{width:22px;height:22px;accent-color:var(--good);flex:none}
.task label{flex:1}
.task.is-done label{text-decoration:line-through;color:var(--muted)}

/* progress list */
.sclist{display:grid;gap:0;background:var(--surface);border-radius:14px;overflow:hidden}
.scrow{display:flex;align-items:center;gap:14px;padding:14px 16px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;width:100%}
.scrow:first-child{border-top:0}
.scrow .ic{font-size:1.6rem;width:36px;text-align:center}
.scrow .nm{flex:1;min-width:0}
.scrow .nm b{display:block}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--good);border-radius:3px}
.scrow .cnt{font-size:.85rem;color:var(--muted);white-space:nowrap}

/* lesson */
.back{border:0;background:none;color:var(--muted);padding:4px 0;font-weight:600;display:inline-flex;gap:4px;align-items:center}
.lesson-top{display:flex;align-items:center;gap:14px;margin:8px 0 6px}
.lesson-top .ic{font-size:2.6rem}
.note{background:var(--sunk);border-radius:12px;padding:12px 14px;font-size:.92rem;margin:14px 0}
.note .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px}
.phl{background:var(--surface);border-radius:14px}
.ph{display:flex;gap:12px;padding:16px;border-top:1px solid var(--line)}
.ph:first-child{border-top:0}
.ph .main{flex:1;min-width:0}
.ph .thx{font-family:var(--thai);font-size:1.55rem;font-weight:600;line-height:1.35;word-break:break-word}
.pt{font-size:.95rem;color:var(--gold);font-weight:600;margin-left:6px;white-space:nowrap}
.ph .rom{font-size:1.02rem}
.ph .rom .ptr{color:var(--gold);font-weight:500;font-size:.9rem}
.ph .mean{font-weight:700;margin-top:2px}
.ph .zh{font-size:.88rem;color:var(--muted)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;color:var(--gold);border:1px solid currentColor;border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px}
.ph .act{display:flex;flex-direction:column;gap:8px}

/* practice */
.modes{display:grid;gap:10px}
.mode{display:flex;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px}
.mode .ic{font-size:1.8rem}
.mode b{display:block;font-size:1.05rem}
.scope{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.scope select{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;max-width:100%}
.card{background:var(--surface);border-radius:20px;padding:30px 22px;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.card .q{font-size:1.7rem;font-weight:900}
.card .thq{font-family:var(--thai);font-size:2.4rem;font-weight:600;line-height:1.3}
.card .rom{font-size:1.25rem}
.counter{display:flex;justify-content:space-between;font-size:.9rem;color:var(--muted);margin:12px 2px}
.actions{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;font-size:1.05rem}
.opt .th{font-size:1.3rem}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.score{font-size:3.4rem;font-weight:900;color:var(--indigo);line-height:1}

/* tools */
.bigcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bigcard{border:0;background:var(--surface);border-radius:14px;padding:14px;text-align:left;min-height:88px}
.bigcard .th{font-size:1.15rem;font-weight:600;display:block;line-height:1.35}
.bigcard .zh{font-size:.85rem;color:var(--muted)}
.panel{background:var(--surface);border-radius:14px;padding:16px}
.field{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field input{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:1.1rem;width:140px}
.numout .thx{font-family:var(--thai);font-size:1.6rem;font-weight:600;margin-top:10px;word-break:break-word}
.search{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:11px 16px;margin-bottom:10px}
.tips{margin:0;padding-left:1.2em}
.tips li{margin:.5em 0}
.emerg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.emerg a{background:var(--surface);border-radius:12px;padding:12px;text-decoration:none;color:var(--ink);text-align:center}
.emerg b{display:block;font-size:1.5rem;color:var(--red)}

/* overlay */
.ov{position:fixed;inset:0;z-index:50;background:#FFFFFF;color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));text-align:center}
.ov .huge{font-family:var(--thai);font-weight:800;font-size:clamp(2.6rem,11vw,5.5rem);line-height:1.3}
.ov .zh{font-size:1.1rem;color:#555;margin-top:12px}
.ov textarea{margin-top:18px;width:min(560px,100%);font-size:1.6rem;border:2px solid #ccc;border-radius:12px;padding:12px;font-family:var(--thai);color:#111;background:#fff}
.ov .bar2{display:flex;gap:10px;margin-top:24px}
.ov .btn.ghost{color:#111;border-color:#bbb}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.92rem;z-index:60;max-width:90vw}
@media (prefers-reduced-motion:no-preference){
  .card{animation:pop .22s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
</style>
</head>

/* ---------- 聲調著色 ---------- */
function toneOf(s){const n=s.normalize('NFD');if(n.includes('\u0300'))return'low';if(n.includes('\u0302'))return'fall';if(n.includes('\u0301'))return'high';if(n.includes('\u030C'))return'rise';return'mid';}
function romHTML(r){
  return String(r).split(/([\s\-]+)/).map(p=>{
    if(!p)return'';
    if(/^[\s\-]+$/.test(p))return '<span class="sep">'+(p.includes('-')?'-':' ')+'</span>';
    if(/_|＿/.test(p)||!/[a-zA-Zɔɛʉəŋ]/.test(p))return esc(p);
    return '<span class="t-'+toneOf(p)+'">'+esc(p)+'</span>';
  }).join('');
}

let thVoice=null,TTS=null,ttsTh=false;
let thVoices=[];
const FEM=/premwadee|pattara|kanya|narisa|achara|female|woman|หญิง|google/i, MAL=/niwat|\bmale\b|\bman\b|ชาย/i;
function loadVoices(){try{const vs=speechSynthesis.getVoices();thVoices=vs.filter(v=>/^th(-|_|$)/i.test(v.lang));thVoice=thVoices[0]||null;}catch(e){}}
function pickVoice(){
  if(!thVoices.length)return thVoice;
  const f=thVoices.filter(v=>FEM.test(v.name)), m=thVoices.filter(v=>!FEM.test(v.name)&&MAL.test(v.name));
  const pref=S.gender==='f'?f:m;
  const online=pref.find(v=>/online|natural/i.test(v.name));
  return online||pref[0]||thVoices[0];
}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
if(window.claude&&claude.use){
  claude.use('tts').then(async t=>{TTS=t;if(t){try{const l=await t.languages?.().catch(()=>undefined);ttsTh=Array.isArray(l)&&l.some(x=>/^th/i.test(x));}catch(e){}}}).catch(()=>{});
}
function speechText(o){let t=o.th.replace(/_+|＿+/g,' ');if(o.p)t+=PART[o.p][S.gender][0];return t;}
async function speak(text,slow){
  if('speechSynthesis' in window&&thVoice){
    try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const pv=pickVoice();u.voice=pv;u.lang=pv.lang;u.rate=slow?.55:.9;speechSynthesis.speak(u);return;}catch(e){}
  }
  if(TTS&&ttsTh){try{await TTS.speak(text,{language:'th',rate:slow?.7:1});return;}catch(e){if(e&&e.code==='not_granted'){TTS=null;}}}
  if('speechSynthesis' in window){
    try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='th-TH';u.rate=slow?.55:.9;speechSynthesis.speak(u);
      if(!thVoice&&!window._warned)setTimeout(()=>{window._warned=1;if(!thVoice)toast('找不到泰語語音。請在手機或電腦的語音設定中加入「泰語（ไทย）」語音。');},400);return;}catch(e){}
  }
  toast('這個瀏覽器無法播放語音，請改用 Chrome 或 iPhone 的 Safari。');
}
function sayId(id,slow){const o=BYID[id];if(o)speak(speechText(o),slow);}

/* ---------- 路由 ---------- */
const VIEWS=[['home','首頁'],['learn','學習'],['practice','練習'],['tools','旅途工具']];
function route(){const h=(location.hash||'').slice(1);return VIEWS.some(v=>v[0]===h)?h:'home';}
function go(path){
  const [v,a,b]=path.split('/');
  if(v==='learn'){curSc=a||null;}
  if(v==='practice'){if(a){P.mode=a;P.scope=b||'learned';startPractice();}else P.mode=null;}
  if(location.hash==='#'+v){render();}else location.hash=v;
  if(v==='tools'&&a){setTimeout(()=>{const el=document.getElementById('t-'+a);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},60);}
  else window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});

function renderTabs(){
  const r=route();
  document.getElementById('tabs').innerHTML=VIEWS.map(([k,n])=>`<a href="#${k}" ${r===k?'aria-current="page"':''}>${I[k]}<span>${n}</span></a>`).join('');
}
function render(){
  renderTabs();
  const r=route();const app=document.getElementById('app');
  app.innerHTML=({home:vHome,learn:vLearn,practice:vPractice,tools:vTools})[r]();
}

/* ---------- 練習 ---------- */
const INT=[0,6e4,864e5,2*864e5,4*864e5,7*864e5];
const SES={};
function pool(scope){
  if(scope==='all')return ALL.slice();
  if(scope==='learned')return ALL.filter(o=>S.learned[o.id]);
  return SCBY[scope]?SCBY[scope].list.slice():[];
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startPractice(){
  const p=pool(P.scope);SES.err='';SES.i=0;SES.right=0;SES.wrong=[];SES.flip=false;SES.picked=null;SES.reviewed=0;
  if(P.mode==='flash'){
    const now=Date.now();
    const sorted=p.map(o=>({o,d:(S.srs[o.id]||{d:0}).d})).sort((a,b)=>a.d-b.d);
    let q=sorted.filter(x=>x.d<=now).map(x=>x.o);if(!q.length)q=sorted.map(x=>x.o);
    SES.q=shuffle(q.slice(0,20));SES.dir=SES.dir||'zh';
  }else{
    SES.q=shuffle(p.slice()).slice(0,10);
    SES.q=SES.q.map(o=>{const others=shuffle((p.length>=4?p:ALL).filter(x=>x.id!==o.id&&x.mean!==o.mean)).slice(0,3);return {o,opts:shuffle([o,...others])};});
  }
}
function scopeSelect(){
  const opt=(v,t)=>`<option value="${v}" ${P.scope===v?'selected':''}>${t}</option>`;
  return `<label class="scope"><span>練習範圍</span><select id="scope">${opt('learned','已學會的句子（'+ALL.filter(o=>S.learned[o.id]).length+'）')}${opt('all','全部句子（'+ALL.length+'）')}${SC.map(s=>opt(s.id,s.icon+' '+s.name)).join('')}</select></label>`;
}
function vPractice(){
  if(!P.mode){

}
function vQuiz(){
  if(SES.i>=SES.q.length){
    return `<div class="card"><p class="score">${SES.right}／${SES.q.length}</p><p>${SES.right===SES.q.length?'全對，太厲害了！':'答錯的句子在下面，再聽幾次吧。'}</p><div class="actions"><button class="btn" data-restart>再測一次</button><button class="btn ghost" data-go="practice">回練習選單</button></div></div>

  }
  const {o,opts}=SES.q[SES.i];const listen=P.mode==='listen';
  const head=listen?`<button class="playbig" data-say="${o.id}" aria-label="播放題目">${I.play}</button><p class="muted">聽完選出意思（可以重複播放）</p>`:`<p class="q">${esc(o.mean)}</p><p class="muted">泰語怎麼說？</p>`;
  const optHTML=opts.map((x,k)=>{
    let cls='';if(SES.picked!=null){if(x.id===o.id)cls='right';else if(k===SES.picked)cls='wrong';}
    const body=listen?esc(x.mean):`<span class="th">${esc(x.th)}</span><br><span class="rom small">${romHTML(x.rom)}</span>`;
    return `<button class="opt ${cls}" data-pick="${k}" ${SES.picked!=null?'disabled':''}>${body}</button>`;}).join('');
  const after=SES.picked!=null?`<div class="note"><b>${opts[SES.picked].id===o.id?'答對了！':'正確答案'}</b><div class="th" style="font-size:1.3rem">${esc(o.th)}${ptHTML(o)}</div><div class="rom">${romHTML(o.rom)}</div><div>${esc(o.mean)}　<span class="muted small">近似音：${esc(o.zh)}</span></div></div><div class="actions"><button class="btn" data-next>${SES.i+1<SES.q.length?'下一題':'看結果'}</button></div>`:'';
  return `<div class="counter"><span>第 ${SES.i+1}／${SES.q.length} 題</span><span>答對 ${SES.right}</span></div>
  <div class="card" style="min-height:170px">${head}</div><div class="opts">${optHTML}</div>${after}`;
}

/* ---------- 數字唸法 ---------- */
const DG=[['ศูนย์','sǔun','順'],['หนึ่ง','nʉ̀ng','能'],['สอง','sɔ̌ɔng','鬆'],['สาม','sǎam','三'],['สี่','sìi','細'],['ห้า','hâa','哈'],['หก','hòk','齁'],['เจ็ด','jèt','摘'],['แปด','pɛ̀ɛt','憋'],['เก้า','kâo','告']];
const PL=[null,['สิบ','sìp','戲'],['ร้อย','rɔ́ɔi','若伊'],['พัน','phan','潘'],['หมื่น','mʉ̀ʉn','悶'],['แสน','sɛ̌ɛn','線']];
function under1m(n){
  const ds=String(n).split('').reverse().map(Number);const out=[];
  for(let i=ds.length-1;i>=0;i--){const d=ds[i];if(!d)continue;
    if(i===1){if(d===1)out.push(PL[1]);else if(d===2)out.push(['ยี่','yîi','億'],PL[1]);else out.push(DG[d],PL[1]);}
    else if(i===0){if(d===1&&ds.length>1)out.push(['เอ็ด','èt','欸']);else out.push(DG[d]);}
    else out.push(DG[d],PL[i]);}
  return out;
}
function thaiNum(n){
  if(n===0)return [DG[0]];
  if(n>=1e6){const hi=Math.floor(n/1e6),lo=n%1e6;return [...thaiNum(hi),['ล้าน','láan','爛'],...(lo?under1m(lo):[])];}
  return under1m(n);
}

function bindTools(){
  const ni=document.getElementById('numin');if(!ni)return;

    const n=Math.min(Number(v),999999999);const parts=thaiNum(n);
    out.innerHTML=`<div class="thx">${parts.map(p=>p[0]).join('')}</div><div class="rom">${romHTML(parts.map(p=>p[1]).join('-'))}</div><div class="muted small">近似音：${parts.map(p=>p[2]).join(' ')}</div>`;
    out.dataset.th=parts.map(p=>p[0]).join('');};
  ni.addEventListener('input',show);
  document.getElementById('numplay').onclick=()=>{const t=document.getElementById('numout').dataset.th;if(t)speak(t+' บาท');else toast('先輸入一個數字');};
  const thb=document.getElementById('thb'),twd=document.getElementById('twd'),rate=document.getElementById('rate');
  const r=()=>{const x=parseFloat(rate.value);return x>0?x:S.rate;};
  const fmt=x=>isFinite(x)?(Math.round(x*100)/100).toLocaleString('zh-TW'):'';
  thb.oninput=()=>{twd.value=thb.value?fmt(parseFloat(thb.value)*r()):'';};
  twd.oninput=()=>{thb.value=twd.value?fmt(parseFloat(twd.value)/r()):'';};
  rate.oninput=()=>{const x=parseFloat(rate.value);if(x>0){S.rate=x;save();}thb.oninput();};
  const se=document.getElementById('search');
  const upd=()=>{searchQ=se.value;const q=searchQ.trim().toLowerCase();const box=document.getElementById('searchres');
    if(!q){box.innerHTML='';return;}
    const hits=ALL.filter(o=>(o.mean+o.th+o.rom.normalize('NFD').replace(/[\u0300-\u036f]/g,'')+o.rom+o.zh).toLowerCase().includes(q)).slice(0,30);
    box.innerHTML=hits.length?`<div class="phl">${hits.map(phRow).join('')}</div>`:'<p class="muted">找不到符合的句子，換個關鍵字試試。</p>';};
  se.addEventListener('input',e=>{if(!e.isComposing)upd();});
  se.addEventListener('compositionend',upd);
  document.getElementById('reset').onclick=()=>{if(confirm('確定要清除所有學習進度嗎？這個動作無法復原。')){S.learned={};S.srs={};S.done={};save();render();toast('已清除學習進度');}};
}
function openCard(k){
  const c=CARDS[k];const txt=c[0]+PART[c[2]][S.gender][0];
  const root=document.getElementById('ovroot');
  root.innerHTML=`<div class="ov" role="dialog" aria-modal="true" aria-label="${esc(c[1])}"><div class="huge" lang="th">${esc(txt)}</div><div class="zh">${esc(c[1])}</div>
  ${c[3]==='addr'?'<textarea id="addr" rows="3" placeholder="在這裡輸入飯店名稱或地址（泰文或英文）"></textarea>':''}
  <div class="bar2"><button class="btn" id="ovplay">${I.play.replace('<svg','<svg width="18" height="18"')}播放</button><button class="btn ghost" id="ovclose">關閉</button></div></div>`;
  const ta=document.getElementById('addr');
  if(ta){try{ta.value=localStorage.getItem(KEY+'-addr')||'';}catch(e){}ta.oninput=()=>{try{localStorage.setItem(KEY+'-addr',ta.value);}catch(e){}};}
  document.getElementById('ovplay').onclick=()=>speak(txt);
  const close=()=>{root.innerHTML='';document.removeEventListener('keydown',esck);};
  const esck=e=>{if(e.key==='Escape')close();};document.addEventListener('keydown',esck);
  document.getElementById('ovclose').onclick=close;document.getElementById('ovclose').focus();
}

/* ---------- 事件 ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-go]');if(!b)return;const d=b.dataset;
  if(d.go){go(d.go);return;}
  if(d.say){sayId(d.say,false);return;}
  if(d.slow){sayId(d.slow,true);return;}
  if(d.speak){speak(d.speak,false);return;}
  if(d.learn){S.learned[d.learn]=!S.learned[d.learn];if(!S.learned[d.learn])delete S.learned[d.learn];save();render();return;}
  if(d.learnall){SCBY[d.learnall].list.forEach(o=>S.learned[o.id]=true);save();render();toast('這一課已全部標記為學會');return;}
  if(d.gender){S.gender=d.gender;save();render();return;}
  if(d.day){curDay=+d.day;render();return;}
  if(d.mode){P.mode=d.mode;const sel=document.getElementById('scope');if(sel)P.scope=sel.value;startPractice();render();if(P.mode==='listen'&&SES.q.length)sayId(SES.q[0].o.id);return;}
  if(d.pscope){P.scope=d.pscope;startPractice();render();return;}
  if('restart' in d){startPractice();render();if(P.mode==='listen'&&SES.q.length)sayId(SES.q[0].o.id);return;}
  if(d.dir){SES.dir=d.dir;SES.flip=false;render();return;}
  if('flip' in d){SES.flip=true;render();const o=SES.q[SES.i];if(o)sayId(o.id);return;}
  if(d.rate!==undefined){
    const o=SES.q[SES.i];const cur=S.srs[o.id]||{b:1,d:0};
    if(d.rate==='1'){const nb=Math.min(5,(cur.b||1)+1);S.srs[o.id]={b:nb,d:Date.now()+INT[nb]};}
    else{S.srs[o.id]={b:1,d:Date.now()+INT[1]};if(SES.q.filter(x=>x.id===o.id).length<3)SES.q.push(o);}
    S.learned[o.id]=true;save();SES.reviewed++;SES.i++;SES.flip=false;render();return;
  }
  if(d.pick!==undefined){
    if(SES.picked!=null)return;SES.picked=+d.pick;const it=SES.q[SES.i];
    if(it.opts[SES.picked].id===it.o.id)SES.right++;else SES.wrong.push(it.o);
    render();if(P.mode==='zh2th')sayId(it.o.id);return;
  }
  if('next' in d){SES.i++;SES.picked=null;render();if(P.mode==='listen'&&SES.i<SES.q.length)sayId(SES.q[SES.i].o.id);return;}
  if(d.card!==undefined){openCard(+d.card);return;}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.task){if(t.checked)S.done[t.dataset.task]=true;else delete S.done[t.dataset.task];save();render();}
  if(t.id==='tripdate'&&t.value){S.trip=t.value;save();curDay=todayDay();render();}
  if(t.id==='scope'){P.scope=t.value;}
});
const _render=render;
render=function(){_render();if(route()==='tools')bindTools();};
render();
</script>
